<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Huddle Replay</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* One blocky airport world. Panels are blocks with a hard ink border and hard shadow. */
  --sky:#8ed0f7;--ink:#1b1f3b;--panel:#f3f8fd;--accent:#ff8a3d;--gold:#ffd447;
  --good:#3fae54;--warn:#f2a51a;--bad:#e5484d;--muted:#5b6487;
  --propose:#4f8cff;--counter:#f2a51a;--accept:#3fae54;--reject:#e5484d;--abstain:#9aa3c2;
  --display:"Pixelify Sans","Courier New",monospace;--body:"Poppins",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#e9f5fd;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:20px}h3{font-size:16px}
button{font-family:var(--display);cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
canvas.px{image-rendering:pixelated;display:block}
.wrap{padding:12px 14px}
.blk{background:var(--panel);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:4px}
.btn{font-size:15px;font-weight:700;padding:6px 14px;border:3px solid var(--ink);background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:4px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--accent);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border:2px solid var(--ink);background:#fff;border-radius:3px;font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;margin-bottom:12px}
.bar h2{margin-right:auto}
.outcome{font-family:var(--display);font-size:15px;padding:2px 10px;border:3px solid var(--ink)}
.outcome.consensus{background:#bff0c8}.outcome.fallback{background:#ffc2c4}.outcome.escalation{background:var(--bad);color:#fff}.outcome.pending{background:#fff}
.hearts{display:flex;gap:4px;align-items:center}
.heart{width:22px;height:19px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.stage{position:relative;aspect-ratio:16/10;background:linear-gradient(#8ed0f7 0 60%,#5bb450 60% 62.5%,#8b5a2b 62.5%);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);overflow:hidden;border-radius:4px}
.stage::before{content:"";position:absolute;left:0;right:0;top:62.5%;bottom:0;background:repeating-linear-gradient(90deg,transparent 0 31px,rgba(0,0,0,.18) 31px 34px),repeating-linear-gradient(0deg,transparent 0 31px,rgba(0,0,0,.18) 31px 34px)}
.seat{position:absolute;width:11.5%;transform:translate(-50%,-50%);text-align:center;cursor:pointer;border:0;background:none;padding:0;transition:filter .3s,opacity .3s}
.seat canvas{width:100%}
.seat.dim{opacity:.55;filter:grayscale(.5)}
.seat.lit canvas{filter:drop-shadow(0 0 0 #fff) drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 -2px 0 #fff)}
.tag{display:inline-block;font-family:var(--display);font-size:clamp(10px,1.2vw,13px);background:var(--ink);color:#fff;padding:0 6px;margin-top:2px;white-space:nowrap}
.seat .sub{display:block;font-size:10px;color:#fff;text-shadow:1px 1px 0 var(--ink)}
.antenna{position:absolute;top:-6%;right:4%;width:8px;height:8px;background:#5b6487;border:2px solid var(--ink)}
.antenna.on{background:var(--gold);box-shadow:0 0 0 3px rgba(255,212,71,.5)}
.think{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);padding:1px 7px;font-family:var(--display);font-size:13px;white-space:nowrap;box-shadow:2px 2px 0 var(--ink);display:none}
.think.show{display:block}
.think .dots i{display:inline-block;width:5px;height:5px;background:var(--ink);margin:0 1px;animation:hop 0.9s infinite}
.think .dots i:nth-child(2){animation-delay:.15s}.think .dots i:nth-child(3){animation-delay:.3s}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.gear{display:inline-block;width:12px;height:12px;border:3px dotted var(--ink);border-radius:50%;animation:spin 1.2s linear infinite;vertical-align:-2px;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
.table{position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);width:30%;text-align:center}
.table .top{display:block;background:#b07a45;border:3px solid var(--ink);padding:5px 4px;box-shadow:inset -5px -5px 0 #8b5a2b;font-family:var(--display);color:#fff;text-shadow:1px 1px 0 var(--ink);font-size:clamp(10px,1.2vw,13px);line-height:1.25}
.table .legs{display:flex;justify-content:space-between;padding:0 14%}
.table .legs i{width:9px;height:14px;background:#8b5a2b;border:3px solid var(--ink);border-top:0}
.locks{display:flex;justify-content:center;gap:3px;margin-top:4px;min-height:14px}
.locks i{width:12px;height:12px;border:2px solid var(--ink);background:#fff}
.locks i.ok{background:var(--good)}.locks i.no{background:var(--bad)}
.ring{position:absolute;border:3px solid;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:ring .9s ease-out forwards;z-index:4}
@keyframes ring{from{width:10px;height:10px;opacity:1}to{width:90px;height:90px;opacity:0}}
.packet{position:absolute;width:16px;height:16px;border:3px solid var(--ink);transform:translate(-50%,-50%) rotate(45deg);transition:left .8s ease-in-out,top .8s ease-in-out;z-index:5;box-shadow:0 0 0 3px rgba(255,255,255,.6)}
.token{position:absolute;font-family:var(--display);font-size:11px;background:var(--gold);border:2px solid var(--ink);padding:0 5px;transform:translate(-50%,-50%);transition:left .9s ease-in-out,top .9s ease-in-out;z-index:6;white-space:nowrap}
.shield{position:absolute;width:26px;height:30px;transform:translate(-50%,-50%);z-index:6;animation:pop .9s forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.spark{position:absolute;width:8px;height:8px;z-index:7;animation:spark 1.1s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.cands{padding:10px 12px;margin-top:14px}
.cstrip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:6px}
.cand{border:3px solid var(--ink);background:#d7deef;padding:4px 2px;text-align:center;font-size:11px;line-height:1.25;position:relative;transition:background .4s}
.cand b{display:block;font-family:var(--display);font-size:15px}
.cand.ok{background:#bff0c8}.cand.no{background:#ffc2c4}.cand.pick{background:var(--gold)}
.cand.pick::after{content:"";position:absolute;inset:-7px;border:3px solid var(--gold);box-shadow:0 0 0 2px var(--ink)}
.note{font-size:12px;color:var(--muted);margin:4px 0 0}
.log{padding:10px;display:grid;gap:8px}
.loglist{display:grid;gap:7px;max-height:560px;overflow:auto;padding-right:3px}
.entry{border:2px solid var(--ink);background:#fff;padding:6px 8px;font-size:12.5px}
.entry .eh{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.t{font-family:var(--display);font-size:12px;padding:0 5px;border:2px solid var(--ink)}
.t.SHARE,.t.OFFER,.t.PROPOSAL{background:#cfe2ff}.t.CONCESSION{background:var(--gold)}.t.ACCEPT,.t.CONSENSUS,.t.APPROVED{background:#bff0c8}.t.REJECT,.t.FALLBACK,.t.ESCALATE{background:#ffc2c4}.t.ABSTAIN,.t.CHECK,.t.REVIEW{background:#e6e9f5}
.entry p{margin:3px 0 0}
.entry details summary{font-size:11px;color:var(--muted);cursor:pointer}
.entry pre{margin:3px 0 0;font-size:10.5px;background:#0f1530;color:#c9e3ff;padding:6px;overflow:auto;max-height:200px}
.below{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.below > div{padding:10px 12px}
.plan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.plan div{border:3px solid var(--ink);background:#fff;padding:6px;text-align:center}
.plan small{display:block;font-size:11px;color:var(--muted)}
.plan b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.checks{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:4px;font-size:12.5px}
.checks li{display:grid;grid-template-columns:20px 1fr;gap:6px}
.ck{width:16px;height:16px;border:2px solid var(--ink);display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.ck.ok{background:var(--good)}.ck.no{background:var(--bad)}
.agentcard{padding:10px 12px;margin-top:14px;display:none}
.agentcard.show{display:block}
.agentcard .ah{display:flex;align-items:center;gap:10px}
.agentcard .ah canvas{width:40px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:3px 10px;font-size:12.5px;margin-top:8px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;gap:4px;align-items:center}
.legend i{width:11px;height:11px;border:2px solid var(--ink);display:inline-block;transform:rotate(45deg)}
@media (max-width:900px){.grid,.below{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar blk">
    <h2 id="title">Sky Huddle replay</h2>
    <span class="chip" id="flight"></span>
    <span class="chip">Round <b id="roundNo">0</b> of 2</span>
    <span class="hearts" id="hearts" aria-label="Rounds left"></span>
    <span class="outcome pending" id="outcome">Ready</span>
    <button class="btn go" id="play">Play</button>
    <button class="btn" id="step">Step</button>
    <button class="btn" id="restart">Restart</button>
  </div>
  <div class="grid">
    <div>
      <div class="stage" id="stage">
        <div class="table"><span class="top">Coordinator<br>plain code, no AI</span><span class="legs"><i></i><i></i></span><div class="locks" id="locks"></div></div>
      </div>
      <div class="legend" style="margin-top:8px">
        <span><i style="background:var(--propose)"></i>offer or proposal</span>
        <span><i style="background:var(--accept)"></i>accept</span>
        <span><i style="background:var(--reject)"></i>reject or blocked</span>
        <span><i style="background:var(--abstain)"></i>no vote</span>
        <span><i style="background:var(--gold)"></i>concession</span>
      </div>
      <div class="cands blk">
        <h3>Candidate plans</h3>
        <div class="cstrip" id="cstrip"></div>
        <p class="note" id="cnote">Green passes every hard check. Red breaks at least one. Gold is the plan on the table.</p>
      </div>
      <div class="agentcard blk" id="agentcard"></div>
    </div>
    <section class="log blk">
      <h3>Consensus log</h3>
      <div class="loglist" id="log" aria-live="polite"></div>
    </section>
  </div>
  <div class="below">
    <div class="blk"><h3>Final plan</h3><div class="plan" id="plan"></div><p class="note" id="planNote"></p></div>
    <div class="blk"><h3>Hard checks on the final plan</h3><ul class="checks" id="checks"></ul></div>
  </div>
</div>
<script id="skylog" type="application/json">__SKY_LOG__</script>
<script>
%%SPRITES%%

const LOG=JSON.parse(document.getElementById("skylog").textContent);
const AG={atc:{name:"Ava",role:"ATC"},pilot:{name:"Pip",role:"Pilot"},ground:{name:"Gus",role:"Ground"},mod:{name:"Mo",role:"Duty manager"}};
const POS={atc:[15,50],pilot:[50,24],ground:[85,50],mod:[50,86],coord:[50,55]};
const COL={OFFER:"var(--propose)",PROPOSAL:"var(--propose)",SHARE:"var(--propose)",ACCEPT:"var(--accept)",REJECT:"var(--reject)",ABSTAIN:"var(--abstain)",CONCESSION:"var(--gold)"};
const stage=document.getElementById("stage");
const esc=s=>String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const H=LOG.scenario.historical, cands=LOG.candidates||[], checks=LOG.checks||{};
document.getElementById("title").textContent=LOG.label||"Sky Huddle replay";
document.getElementById("flight").innerHTML=`<b>${esc(H.carrier)} ${esc(H.flight)}</b> ${esc(H.origin)} → ${esc(H.destination)} · sched ${esc(H.scheduled_arrival)} · real data`;

/* seats */
const seats={};
["atc","pilot","ground","mod"].forEach(id=>{
 const b=document.createElement("button");b.className="seat";b.style.left=POS[id][0]+"%";b.style.top=POS[id][1]+"%";
 b.setAttribute("aria-label",`Show ${AG[id].name}'s details`);
 b.innerHTML=`<span class="think"></span>${id!=="mod"?'<span class="antenna"></span>':""}`;
 b.appendChild(blinkable(newSprite(id),id));
 b.insertAdjacentHTML("beforeend",`<span class="tag">${AG[id].name}</span><span class="sub">${AG[id].role}</span>`);
 b.addEventListener("click",()=>showAgent(id));stage.appendChild(b);seats[id]=b});
if(POS.mod){seats.mod.style.width="9%"}

/* helpers */
function heart(full){return `<svg class="heart" viewBox="0 0 13 11" shape-rendering="crispEdges" aria-hidden="true"><path fill="#1b1f3b" d="M2 0h3v1h1v1h1V1h1V0h3v1h1v1h1v4h-1v1h-1v1h-1v1h-1v1H8v1H5v-1H4V9H3V8H2V7H1V6H0V2h1V1h1z"/><path fill="${full?"#e5484d":"#c5cbe0"}" d="M2 1h3v1h1v1h1V2h1V1h3v1h1v4h-1v1h-1v1H9v1H8v1H5V9H4V8H3V7H2V6H1V2h1z"/></svg>`}
function setRound(r){document.getElementById("roundNo").textContent=r;document.getElementById("hearts").innerHTML=heart(r<1)+heart(r<2)}
function think(ids,on,label){ids.forEach(id=>{const t=seats[id].querySelector(".think");t.innerHTML=label||'<span class="gear"></span><span class="dots"><i></i><i></i><i></i></span>';t.classList.toggle("show",on)})}
function spotlight(ids){Object.keys(seats).forEach(id=>{seats[id].classList.toggle("dim",ids&&!ids.includes(id));seats[id].classList.toggle("lit",!!ids&&ids.includes(id))})}
function radio(from,to,type){
 const [x1,y1]=POS[from],[x2,y2]=POS[to],c=COL[type]||"var(--propose)";
 const r=document.createElement("div");r.className="ring";r.style.left=x1+"%";r.style.top=y1+"%";r.style.borderColor=c;stage.appendChild(r);setTimeout(()=>r.remove(),950);
 if(!reduce){const r2=r.cloneNode();r2.style.animationDelay=".25s";stage.appendChild(r2);setTimeout(()=>r2.remove(),1200)}
 const p=document.createElement("div");p.className="packet";p.style.background=c;p.style.left=x1+"%";p.style.top=y1+"%";stage.appendChild(p);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{p.style.left=x2+"%";p.style.top=y2+"%"}));
 setTimeout(()=>{p.remove();const a=seats[to]&&seats[to].querySelector(".antenna");if(a){a.classList.add("on");setTimeout(()=>a.classList.remove("on"),600)}},850);
}
function token(from,txt){const [x1,y1]=POS[from],[x2,y2]=POS.coord;const t=document.createElement("div");t.className="token";t.textContent=txt;t.style.left=x1+"%";t.style.top=(y1-12)+"%";stage.appendChild(t);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{t.style.left=x2+"%";t.style.top=(y2-8)+"%"}));setTimeout(()=>t.remove(),1500)}
function shield(at){const [x,y]=POS[at];const s=document.createElement("div");s.className="shield";s.style.left=x+"%";s.style.top=(y-14)+"%";
 s.innerHTML=`<svg viewBox="0 0 9 10" shape-rendering="crispEdges" width="26" height="30"><path fill="#1b1f3b" d="M1 0h7v1h1v5H8v2H7v1H6v1H3V9H2V8H1V6H0V1h1z"/><path fill="#e5484d" d="M1 1h7v5H7v2H6v1H3V8H2V6H1z"/><path fill="#fff" d="M4 2h1v4H4zM4 7h1v1H4z"/></svg>`;stage.appendChild(s);setTimeout(()=>s.remove(),950)}
function fireworks(){const cols=["#ffd447","#ff8a3d","#3fae54","#4f8cff","#e5484d","#fff"];for(let i=0;i<28;i++){const s=document.createElement("div");s.className="spark";s.style.left="50%";s.style.top="40%";s.style.background=cols[i%6];
 const a=i/28*Math.PI*2,d=60+Math.random()*80;s.style.setProperty("--dx",Math.cos(a)*d+"px");s.style.setProperty("--dy",Math.sin(a)*d+"px");stage.appendChild(s);setTimeout(()=>s.remove(),1200)}}
function locks(rs){document.getElementById("locks").innerHTML=(rs||[]).map(r=>`<i class="${r.passed?"ok":"no"}" title="${esc(r.rule_id)}"></i>`).join("")}
const feas=(set,id)=>(checks[set]&&checks[set][id]||[]).every(r=>r.passed);
function strip(set,pick){
 document.getElementById("cstrip").innerHTML=cands.map(c=>{const st=!set?"":pick===c.id?"pick":feas(set,c.id)?"ok":"no";
  return `<div class="cand ${st}" title="${esc(c.concession||"no concession")}"><b>${esc(c.id)}</b>${esc(c.landing)}<br>gate ${esc(c.gate)}<br>${c.extra_holding_min?("+"+c.extra_holding_min+"m hold"):"no hold"}</div>`}).join("")}
function addLog(turn,type,who,to,text,json){
 const l=document.getElementById("log");if(l.dataset.fresh!=="0"){l.innerHTML="";l.dataset.fresh="0"}
 const e=document.createElement("div");e.className="entry";
 e.innerHTML=`<div class="eh">${turn!==null?`<span class="chip">${turn===0?"Setup":"Round "+turn}</span>`:""}<span class="t ${type}">${type}</span><b>${esc(who)}</b>${to?`<span style="color:var(--muted)">→ ${esc(to)}</span>`:""}</div><p>${esc(text)}</p>${json?`<details><summary>Message JSON</summary><pre>${esc(JSON.stringify(json,null,2))}</pre></details>`:""}`;
 l.appendChild(e);l.scrollTop=l.scrollHeight}

/* build the timeline from the log */
const r1=(LOG.rounds||[]).find(r=>r.round===1),r2=(LOG.rounds||[]).find(r=>r.round===2),cp=LOG.compromise,out=LOG.outcome;
const ids=["atc","pilot","ground"];
const steps=[];
steps.push(()=>{setRound(0);spotlight(null);ids.forEach(id=>radio("coord",id,"SHARE"));strip(null);
 addLog(0,"SHARE","Coordinator","Ava, Pip, Gus",`Scenario ${LOG.scenario.scenario_id} shared: ${H.carrier} ${H.flight} ${H.origin}→${H.destination}, weather delay ${H.weather_delay_min} min, late aircraft ${H.late_aircraft_delay_min} min. Each agent also gets its own private simulated state.`,null)});
if(r1){
 steps.push(()=>{setRound(1);spotlight(ids);think(ids,true);strip("before_concessions");
  addLog(1,"CHECK","Coordinator","",`Checker ran on ${cands.length} candidates before any concession: ${(cp&&cp.feasible_before||[]).length} pass (${(cp&&cp.feasible_before||[]).join(", ")||"none"}). All three agents think in parallel.`,null)});
 r1.offers.forEach(o=>steps.push(()=>{think([o.agent],false);radio(o.agent,"coord","OFFER");
  addLog(1,"OFFER",AG[o.agent].name,"Coordinator",`Prefers ${o.preferred}. Accepts ${o.acceptable.join(", ")}. Cites ${o.constraints_cited.join(", ")}. ${o.rationale}`,o)}));
 const concs=(cp&&cp.concessions_applied)||[];
 if(concs.length)steps.push(()=>{spotlight(["atc","pilot","ground"]);concs.forEach(c=>token(c.agent,c.id.replace(/_/g," ").toLowerCase()));
  setTimeout(()=>strip("after_concessions"),700);
  addLog(1,"CONCESSION","Coordinator","",`Applied ${concs.map(c=>`${AG[c.agent].name}: ${c.id} (${c.target})`).join("; ")}. Now ${cp.feasible_after.length} candidates pass: ${cp.feasible_after.join(", ")}.`,concs)});
}
if(cp&&cp.proposal){
 steps.push(()=>{spotlight(null);strip("after_concessions",cp.proposal.candidate);ids.forEach(id=>radio("coord",id,"PROPOSAL"));
  const c=cands.find(x=>x.id===cp.proposal.candidate),k=LOG.costs[c.id];
  addLog(1,"PROPOSAL","Coordinator","Ava, Pip, Gus",`Frozen proposal v${cp.proposal.version}: ${c.id}, land ${c.landing}, gate ${c.gate}, ${c.extra_holding_min} min extra holding. Rule: ${cp.rule}. Simulated cost $${k.total_usd.toLocaleString()}.`,cp.proposal)});
}
if(r2){
 steps.push(()=>{setRound(2);spotlight(ids);think(ids,true)});
 r2.votes.forEach(v=>steps.push(()=>{think([v.agent],false);const T=v.vote.toUpperCase();
  if(v.vote==="abstain"){think([v.agent],true,"⌛ timeout");setTimeout(()=>think([v.agent],false),1400)}
  radio(v.agent,"coord",T);if(v.vote!=="accept")setTimeout(()=>shield("coord"),700);
  addLog(2,T,AG[v.agent].name,"Coordinator",v.rationale,v)}));
}
steps.push(()=>{spotlight(null);const fc=out.final_candidate;
 const set=out.type==="fallback"?"before_concessions":"after_concessions";
 if(fc){locks(checks[set][fc]);strip(set,fc)}
 if(out.type==="consensus"){fireworks();addLog(null,"CONSENSUS","Coordinator","",`${out.reason} Unlocked by: ${(out.concessions_that_unlocked||[]).join(" + ")||"no concession"}.`,out)}
 else if(out.type==="fallback"){shield("coord");addLog(null,"FALLBACK","Rulebook","",`${out.reason} Rulebook picks ${fc}.`,LOG.fallback)}
 else{shield("coord");addLog(null,"ESCALATE","Rulebook","Mo",out.reason,out)}
 const o=document.getElementById("outcome");o.className="outcome "+out.type;o.textContent=out.type==="consensus"?"Consensus":out.type==="fallback"?"Fallback, not consensus":"Escalated";
 renderFinal()});
steps.push(()=>{spotlight(["mod"]);radio("coord","mod","PROPOSAL");
 const hd=LOG.human_decision;
 think(["mod"],true,hd?(hd.approved?"Approved":"Rejected"):"Reviewing");
 addLog(null,hd?(hd.approved?"APPROVED":"REJECT"):"REVIEW","Mo (duty manager)","",hd?`${hd.approved?"Approved":"Rejected"} by ${hd.by||"duty manager"}. ${hd.note||""}`:"Evidence sent to the duty manager. Approve or reject in the app.",hd)});

/* final */
function renderFinal(){
 const fc=out.final_candidate,c=cands.find(x=>x.id===fc),k=fc&&LOG.costs[fc];
 const pl=document.getElementById("plan");
 if(!c){pl.innerHTML=`<div style="grid-column:1/-1"><b>No feasible plan</b><small>Duty manager decides</small></div>`;document.getElementById("checks").innerHTML="";document.getElementById("planNote").textContent=out.reason;return}
 pl.innerHTML=[["Plan",c.id],["Land",c.landing],["Gate",c.gate],["Extra hold",c.extra_holding_min+" min"]].map(([a,b])=>`<div><small>${a}</small><b>${esc(b)}</b></div>`).join("");
 const fb=LOG.baselines&&LOG.baselines.solver;
 document.getElementById("planNote").textContent=`Simulated cost $${k.total_usd.toLocaleString()} (delay ${k.delay_min} min, holding fuel ${k.holding_fuel_kg} kg, crew overtime ${k.overtime_min} min, ${k.missed_connections} missed connections). ${out.type==="fallback"?"Labelled fallback: the agents did not agree.":""}`;
 const set=out.type==="fallback"?"before_concessions":"after_concessions";
 document.getElementById("checks").innerHTML=checks[set][fc].map(r=>`<li><span class="ck ${r.passed?"ok":"no"}">${r.passed?"✓":"!"}</span><span><b>${esc(r.rule_id)}</b> ${esc(r.explanation)} <span style="color:var(--muted)">(${esc(r.basis)})</span></span></li>`).join("");
}
function resetFinal(){document.getElementById("plan").innerHTML=["Plan","Land","Gate","Extra hold"].map(a=>`<div><small>${a}</small><b>–</b></div>`).join("");document.getElementById("checks").innerHTML="";document.getElementById("planNote").textContent="Press Play to replay the negotiation.";locks([])}

/* agent card */
function showAgent(id){
 const card=document.getElementById("agentcard");card.classList.add("show");
 const o=r1&&r1.offers.find(x=>x.agent===id),v=r2&&r2.votes.find(x=>x.agent===id),sim=(LOG.scenario.simulated||{})[id];
 card.innerHTML=`<div class="ah"><span id="acs"></span><div><h3>${AG[id].name}, ${AG[id].role}</h3><p class="note">${id==="mod"?"The human who approves or rejects the final plan.":"Its own LLM call each round, with its own prompt and private state."}</p></div></div>
 <dl class="kv">${id==="mod"?`<dt>Decision</dt><dd>${esc(LOG.human_decision?(LOG.human_decision.approved?"Approved":"Rejected"):"Pending in the app")}</dd>`:
 `<dt>Private state</dt><dd>${esc(sim?JSON.stringify(sim):"–")} <em>(simulated)</em></dd>
 <dt>Round 1 prefers</dt><dd>${esc(o?o.preferred:"–")}</dd><dt>Accepts</dt><dd>${esc(o?o.acceptable.join(", "):"–")}</dd>
 <dt>Checks cited</dt><dd>${esc(o?o.constraints_cited.join(", "):"–")}</dd><dt>Concession</dt><dd>${esc(o&&o.concessions.length?o.concessions.map(c=>c.id+" ("+c.target+")").join(", "):"none")}</dd>
 <dt>Reasoning</dt><dd>${esc(o?o.rationale:"–")}</dd><dt>Round 2 vote</dt><dd>${esc(v?v.vote+": "+v.rationale:"–")}</dd>`}</dl>`;
 card.querySelector("#acs").appendChild(newSprite(id));
}

/* player */
let i=0,timer=null;
function restart(){clearTimeout(timer);i=0;document.getElementById("log").dataset.fresh="1";document.getElementById("log").innerHTML='<p class="note">Press Play. Every message appears here with its JSON.</p>';
 setRound(0);spotlight(null);think(["atc","pilot","ground","mod"],false);strip(null);resetFinal();const o=document.getElementById("outcome");o.className="outcome pending";o.textContent="Ready"}
function step(){if(i>=steps.length)return false;steps[i++]();return i<steps.length}
document.getElementById("play").addEventListener("click",()=>{restart();const tick=()=>{if(step())timer=setTimeout(tick,reduce?60:1500)};tick()});
document.getElementById("step").addEventListener("click",()=>{clearTimeout(timer);if(i>=steps.length)restart();step()});
document.getElementById("restart").addEventListener("click",restart);
restart();
</script>
</body>
</html>
