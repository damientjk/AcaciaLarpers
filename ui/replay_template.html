<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Huddle Replay</title>
<link href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* One blocky airport world. Panels are blocks with a hard ink border and hard shadow. */
  --ink:#1b1f3b;--panel:#f3f8fd;--accent:#ff8a3d;--gold:#ffd447;
  --good:#3fae54;--bad:#e5484d;--muted:#5b6487;
  --propose:#4f8cff;--accept:#3fae54;--reject:#e5484d;--abstain:#9aa3c2;
  --display:"Jersey 15","Courier New",monospace;--body:"Poppins",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden}
body{background:transparent;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
h3{font-family:var(--display);font-weight:400;margin:0;font-size:20px;letter-spacing:.02em}
button{font-family:var(--display);cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
canvas.px{image-rendering:pixelated;display:block}
.wrap{padding:2px 8px 10px 2px}
.blk{background:var(--panel);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:4px}
.btn{font-size:18px;padding:5px 16px;border:3px solid var(--ink);background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:4px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--accent);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border:2px solid var(--ink);background:#fff;border-radius:3px;font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar .grow{margin-right:auto}
.outcome{font-family:var(--display);font-size:18px;padding:3px 12px;border:3px solid var(--ink)}
.outcome.consensus{background:#bff0c8}.outcome.fallback{background:#ffc2c4}.outcome.escalation{background:#b42318;color:#fff}.outcome.pending{background:#fff}
.grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:14px}
/* The full 16:9 backdrop, no tint, so the sky, plane and terminal keep their colours. */
.stage{position:relative;aspect-ratio:16/9;background:#8ed0f7;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);overflow:hidden;border-radius:4px}
.stage canvas.bg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
/* Characters: one size, anchored by their feet at their own spot (tower, plane, terminal). */
.seat{position:absolute;width:6.9%;transform:translate(-50%,-100%);cursor:pointer;border:0;background:none;padding:0;transition:filter .3s,opacity .3s;z-index:3}
.seat canvas{width:100%}
.seat.dim{opacity:.6;filter:grayscale(.5)}
.seat.lit canvas{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 2px 0 #fff)}
.label{position:absolute;top:100%;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;line-height:1.15;pointer-events:none}
.tag{display:inline-block;font-family:var(--display);font-size:clamp(13px,1.15vw,16px);background:var(--ink);color:#fff;padding:2px 7px}
.bubble{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);padding:3px 8px;font-size:clamp(11px,1.05vw,13px);line-height:1.3;width:max-content;max-width:min(200px,24vw);text-align:left;border-radius:3px;box-shadow:2px 2px 0 var(--ink);font-weight:500;pointer-events:none;z-index:4}
.bubble::after{content:"";position:absolute;left:calc(50% - 5px);top:100%;border:5px solid transparent;border-top-color:var(--ink)}
.seat.right .bubble{left:108%;bottom:auto;top:8%;transform:none}
.seat.right .bubble::after{left:-10px;top:8px;border-top-color:transparent;border-right-color:var(--ink)}
.quiet .bubble,.seat.busy .bubble{display:none}
.think{position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);padding:3px 8px;font-family:var(--display);font-size:15px;white-space:nowrap;box-shadow:2px 2px 0 var(--ink);display:none}
.think.show{display:block}
.think.spinonly{background:none;border:0;box-shadow:none;padding:0}
.ring{position:absolute;border:3px solid;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:ring .9s ease-out forwards;z-index:4}
@keyframes ring{from{width:10px;height:10px;opacity:1}to{width:80px;height:80px;opacity:0}}
.packet{position:absolute;width:14px;height:14px;border:3px solid var(--ink);transform:translate(-50%,-50%) rotate(45deg);transition:left .8s ease-in-out,top .8s ease-in-out;z-index:5;box-shadow:0 0 0 3px rgba(255,255,255,.6)}
.token{position:absolute;font-family:var(--display);font-size:13px;background:var(--gold);border:2px solid var(--ink);padding:0 5px;transform:translate(-50%,-50%);transition:left .9s ease-in-out,top .9s ease-in-out;z-index:6;white-space:nowrap}
.shield{position:absolute;width:24px;height:28px;transform:translate(-50%,-50%);z-index:6;animation:pop .9s forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.spark{position:absolute;width:7px;height:7px;z-index:7;animation:spark 1.1s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
/* The coordinator's board: small, bottom middle. */
.board{position:absolute;left:52%;top:57%;transform:translate(-50%,-100%);text-align:center;z-index:2;width:max-content;max-width:40%}
.board .top{display:block;background:#b07a45;border:3px solid var(--ink);padding:2px 4px;box-shadow:inset -4px -4px 0 #8b5a2b;font-family:var(--display);color:#fff;text-shadow:1px 1px 0 var(--ink);font-size:clamp(12px,1.05vw,15px);line-height:1.1}
.locks{display:flex;justify-content:center;gap:3px;margin-top:3px;min-height:10px}
.locks i{width:10px;height:10px;border:2px solid var(--ink);background:#fff}
.locks i.ok{background:var(--good)}.locks i.no{background:var(--bad)}
.plancard{display:block;margin:0 auto 4px;width:max-content;max-width:100%;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-family:var(--display);font-size:clamp(13px,1.15vw,16px);padding:3px 10px;color:var(--ink)}
.plancard.flip{animation:flip .5s}
@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
/* Bottom-left status: a spinner while anyone is thinking. */
.status{position:absolute;left:50%;bottom:2.5%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:rgba(27,31,59,.92);color:#fff;border:2px solid #fff;padding:5px 14px;font-family:var(--display);font-size:clamp(13px,1.15vw,16px);line-height:1.2;max-width:74%;z-index:7;text-align:center}
.status .spin{width:16px;height:16px;flex:none}
.status.idle .spin{display:none}
.spin{position:relative;display:inline-block;width:28px;height:28px;animation:spin12 1s steps(12) infinite}
.spin i{position:absolute;left:44%;top:0;width:14%;height:32%;background:#fff;border:1.5px solid var(--ink);border-radius:3px;transform-origin:50% 156%}
@keyframes spin12{to{transform:rotate(360deg)}}
.splash{position:absolute;left:50%;top:16%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(28px,4.4vw,54px);color:#fff;text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);opacity:0;z-index:8;pointer-events:none;text-align:center;line-height:1.05;white-space:nowrap}
.splash small{display:block;font-size:.45em}
.splash.go{animation:splash 1.4s ease-out}
@keyframes splash{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1}100%{opacity:0}}
.stamp{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%) rotate(-8deg);font-family:var(--display);font-size:clamp(26px,3.6vw,46px);padding:0 16px;border:4px solid;background:rgba(255,255,255,.92);z-index:8;animation:stampin .35s ease-out}
@keyframes stampin{from{transform:translate(-50%,-50%) rotate(-8deg) scale(2.2);opacity:0}}
/* Log column matches the stage height; only the list scrolls. */
.side{position:relative;min-height:260px}
.log{position:absolute;inset:0;padding:10px;display:flex;flex-direction:column;gap:8px}
.loglist{flex:1;min-height:0;display:grid;align-content:start;gap:7px;overflow:auto;padding-right:3px}
.entry{border:2px solid var(--ink);background:#fff;padding:5px 8px;font-size:12.5px}
.entry .eh{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.t{font-family:var(--display);font-size:14px;padding:2px 7px;border:2px solid var(--ink)}
.t.SHARE,.t.OFFER,.t.PROPOSAL,.t.LIVE{background:#cfe2ff}.t.CONCESSION{background:var(--gold)}.t.ACCEPT,.t.CONSENSUS,.t.APPROVED{background:#bff0c8}.t.REJECT,.t.FALLBACK,.t.ESCALATE{background:#ffc2c4}.t.ABSTAIN,.t.CHECK,.t.REVIEW{background:#e6e9f5}
.entry p{margin:3px 0 0}
.entry details summary{font-size:11px;color:var(--muted);cursor:pointer}
.entry pre{margin:3px 0 0;font-size:10.5px;background:#0f1530;color:#c9e3ff;padding:6px;overflow:auto;max-height:180px}
.note{font-size:12px;color:var(--muted);margin:4px 0 0}
.cands{padding:8px 12px;margin-top:12px}
.cstrip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:6px}
.cand{border:3px solid var(--ink);background:#d7deef;padding:3px 2px;text-align:center;font-size:11px;line-height:1.25;position:relative;transition:background .4s}
.cand b{display:block;font-family:var(--display);font-size:18px;line-height:1}
.cand.ok{background:#bff0c8}.cand.no{background:#ffc2c4}.cand.pick{background:var(--gold)}
.cand.pick::after{content:"";position:absolute;inset:-6px;border:3px solid var(--gold);box-shadow:0 0 0 2px var(--ink)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;gap:4px;align-items:center}
.legend i{width:10px;height:10px;border:2px solid var(--ink);display:inline-block;transform:rotate(45deg)}
.agentcard{padding:10px 12px;margin-top:12px;display:none}
.agentcard.show{display:block}
.agentcard .ah{display:flex;align-items:center;gap:10px}
.agentcard .ah canvas{width:34px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:3px 10px;font-size:12.5px;margin-top:8px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.live .ctl{display:none}
.v-airport .side,.v-airport .cands,.v-airport .agentcard{display:none}
.v-airport .grid{grid-template-columns:1fr}
.place{position:absolute;font-family:var(--display);font-size:clamp(12px,1vw,14px);padding:2px 8px !important;background:#334155;color:#fff;padding:0 5px;border:2px solid var(--ink);z-index:1;pointer-events:none}
.think.say{font-family:var(--body);font-size:clamp(11px,.95vw,12px);font-weight:600;max-width:min(200px,24vw);white-space:normal;width:max-content;text-align:left;padding:2px 7px;line-height:1.25}
@media (max-width:820px){.grid{grid-template-columns:1fr}.side{min-height:300px}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="bar">
    <span class="chip grow" id="flight"></span>
    <span class="chip" id="modelchip"></span>
    <span class="chip">Round <b id="roundNo">0</b> of 2</span>
    <span class="outcome pending" id="outcome">Ready</span>
    <button class="btn go ctl" id="play">Play</button>
    <button class="btn ctl" id="step">Step</button>
    <button class="btn ctl" id="restart">Restart</button>
  </div>
  <div class="grid">
    <div>
      <div class="stage" id="stage">
        <canvas class="bg" id="sceneCanvas" width="320" height="180"></canvas>
        <div class="splash" id="splash"></div>
        <div class="board"><span class="plancard" id="plancard">No plan yet</span><div class="locks" id="locks"></div></div>
        <div class="place" style="left:6.5%;top:35.5%">TOWER</div>
        <div class="place" id="gateLabel" style="left:76.5%;top:56.4%">GATES</div>
        <div class="status idle" id="status"><span class="spin" id="statusSpin"></span><span id="statusText">Ready</span></div>
      </div>
    </div>
    <div class="side">
      <section class="log blk">
        <h3>Consensus log</h3>
        <div class="loglist" id="log" aria-live="polite"></div>
      </section>
    </div>
  </div>
  <div class="cands blk">
    <h3>Candidate plans</h3>
    <div class="cstrip" id="cstrip"></div>
    <p class="note" id="cnote">Green passes every hard check. Red breaks at least one. Gold is the plan on the table. Click a character to see what they know.</p>
    <div class="legend">
      <span><i style="background:var(--propose)"></i>offer or proposal</span>
      <span><i style="background:var(--accept)"></i>accept</span>
      <span><i style="background:var(--reject)"></i>reject or blocked</span>
      <span><i style="background:var(--abstain)"></i>no vote</span>
      <span><i style="background:var(--gold)"></i>concession</span>
    </div>
  </div>
  <div class="agentcard blk" id="agentcard"></div>
</div>
<script id="skylog" type="application/json">__SKY_LOG__</script>
<script id="skylive" type="application/json">__SKY_LIVE__</script>
<script id="skyview" type="application/json">__SKY_VIEW__</script>
<script>
%%SPRITES%%

const LOG=JSON.parse(document.getElementById("skylog").textContent);
const LIVE=JSON.parse(document.getElementById("skylive").textContent);
const VIEW=JSON.parse(document.getElementById("skyview").textContent)||"huddle";
document.getElementById("wrap").classList.add("v-"+VIEW);
const AG={atc:{name:"Ava",role:"ATC"},pilot:{name:"Pip",role:"Pilot"},ground:{name:"Gus",role:"Ground"},mod:{name:"Coco",role:"Coordinator"}};
/* Feet positions on the 320 x 180 backdrop: Ava at the tower base, Pip on the plane by the cockpit,
   Gus at the terminal, Coco the coordinator on the runway. */
const FEET={atc:[12.5,22.2],pilot:[51.9,42.2],ground:[81.9,84.4],mod:[52,84.4]};
/* Message targets (roughly chest height) and the board. */
const POS={atc:[12.5,14],pilot:[51.9,34],ground:[81.9,76],mod:[52,74],coord:[52,74]};
const COL={OFFER:"var(--propose)",PROPOSAL:"var(--propose)",SHARE:"var(--propose)",ACCEPT:"var(--accept)",REJECT:"var(--reject)",ABSTAIN:"var(--abstain)",CONCESSION:"var(--gold)"};
const stage=document.getElementById("stage");
const esc=s=>String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const H=LOG.scenario.historical, cands=LOG.candidates||[], checks=LOG.checks||{};
document.getElementById("flight").innerHTML=`<b>${esc(H.carrier)} ${esc(H.flight)}</b> ${esc(H.origin)} → ${esc(H.destination)} · sched ${esc(H.scheduled_arrival)} · ${esc(H.arrival_delay_min)} min late · real data`;
const spinnerHTML=()=>`<span class="spin">${Array.from({length:12},(_,k)=>`<i style="transform:rotate(${k*30}deg);opacity:${(.25+k/16).toFixed(2)}"></i>`).join("")}</span>`;
document.getElementById("statusSpin").outerHTML=spinnerHTML().replace('class="spin"','class="spin" id="statusSpin"');

/* seats */
const seats={};
["atc","pilot","ground","mod"].forEach(id=>{
 const b=document.createElement("button");b.className="seat"+(id==="atc"||id==="mod"?" right":"");b.style.left=FEET[id][0]+"%";b.style.top=FEET[id][1]+"%";
 b.setAttribute("aria-label",`Show ${AG[id].name}'s details`);
 b.innerHTML=`<span class="think"></span><span class="bubble"></span>`;
 b.appendChild(blinkable(newSprite(id),id));
 b.insertAdjacentHTML("beforeend",`<span class="label"><span class="tag">${AG[id].name} · ${AG[id].role}</span></span>`);
 b.addEventListener("click",()=>showAgent(id));stage.appendChild(b);seats[id]=b});

/* idle speech bubbles: short facts from each agent's private (simulated) state */
function facts(){
 const S=LOG.scenario.simulated||{},a=S.atc||{},p=S.pilot||{},g=S.ground||{};
 const sl=a.slots||[],taken=sl.filter(s=>s.occupant).length,eta=(a.base_eta||"").slice(11,16);
 const pax=(p.connections||[]).reduce((n,c)=>n+(c.passengers||0),0);
 const pg=(g.gates||[]).find(x=>x.gate_id===g.planned_gate),busy=pg&&(pg.occupancy||[]).length?pg.occupancy.map(o=>o.end).sort().pop().slice(11,16):null;
 if(g.planned_gate)document.getElementById("gateLabel").textContent="GATE "+g.planned_gate;
 return{atc:(H.weather_delay_min>15?"Weather cut my arrival rate. ":`${H.carrier}${H.flight} is ${H.arrival_delay_min} min late. `)+(sl.length?`${taken} of ${sl.length} slots near ${eta} are taken.`:"Finding a slot."),
  pilot:(p.fuel_safe_holding_min!=null?`${p.fuel_safe_holding_min} min of holding is fuel-safe. `:"")+(pax?`${pax} passengers connecting.`:"Watching my fuel."),
  ground:g.planned_gate?(busy?`Gate ${g.planned_gate} is busy until ${busy}.`:`Gate ${g.planned_gate} is free.`):"Checking gates and crew.",
  mod:LOG.human_decision?(LOG.human_decision.approved?"You approved this plan.":"You rejected this plan."):"I check every plan in plain code, no AI."}}
const F=facts();Object.keys(seats).forEach(id=>{seats[id].querySelector(".bubble").textContent=F[id]});
function quiet(on){stage.classList.toggle("quiet",on)}

/* the animated airport, ported from the Sky Huddle design artifact (same 320 x 180 scene as backdrop.png) */
const sc=document.getElementById("sceneCanvas"),sx=sc.getContext("2d"),SW=320,SH=180,STORM=(H.weather_delay_min||0)>15;
const clouds=[{x:20,y:18,s:1},{x:120,y:36,s:.7},{x:210,y:14,s:1.2},{x:300,y:44,s:.8}];
function R(x,y,w,h,c){sx.fillStyle=c;sx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function cloud(x,y,s){const w=30*s;R(x,y+4,w,6,"#fff");R(x+5*s,y,w*.55,10,"#fff");R(x+3*s,y+9,w-4,2,"#d6eefc")}
function drawScene(t){
 ["#7cc6f5","#8ed0f7","#a3daf9","#b8e4fb","#cdeefd"].forEach((c,i)=>R(0,i*24,SW,24,c));
 for(let a=-12;a<=12;a++)for(let b=-12;b<=12;b++){const r=a*a+b*b;if(r<144)R(282+a,30+b,1,1,r<90?"#ffd447":"#ffe68a")}
 clouds.forEach(c=>{const x=((c.x+t*0.006*c.s)%(SW+60))-40;cloud(x,c.y,c.s)});
 if(STORM){R(110,20,90,10,"#6b7280");R(120,14,60,8,"#6b7280");R(104,28,100,6,"#4b5563");
  for(let i=0;i<22;i++){const x=108+(i*41)%96,y=34+((t*0.08+i*13)%34);R(x,y,1,4,"#93c5fd")}
  if(Math.floor(t/1700)%5===0&&(t%1700)<120){R(150,34,2,8,"#ffe066");R(148,42,2,6,"#ffe066")}}
 [[0,14],[18,22],[34,12],[62,26],[80,16],[180,20],[196,30],[214,18],[300,24]].forEach(([x,h])=>R(x,128-h,16,h,"#a7c4e0"));
 for(let x=0;x<SW;x+=8){const h=6+((x*37)%9);R(x,135-h,8,h,"#78c46a")}
 R(0,133,SW,7,"#5bb450");R(0,133,SW,2,"#7ed36b");
 R(0,140,SW,20,"#4b5563");R(0,140,SW,1,"#9ca3af");R(0,159,SW,1,"#9ca3af");
 for(let x=4;x<SW;x+=22)R(x,149,12,2,"#f8fafc");
 for(let x=6;x<SW;x+=16)R(x,141,2,1,(Math.floor(t/400)+x/16)%2<1?"#ffd447":"#8b7a2a");
 for(let y=160;y<SH;y+=10)for(let x=0;x<SW;x+=10){R(x,y,10,10,"#8b5a2b");R(x,y,10,1,"#a06a36");R(x+9,y,1,10,"#6d4420");R(x+3+(x*y)%5,y+4,2,2,"#6d4420")}
 R(30,62,22,78,"#d6dde6");R(46,62,6,78,"#b4bfcc");for(let y=72;y<136;y+=12)R(36,y,6,4,"#334155");
 R(20,46,42,16,"#94a3b8");R(23,48,36,10,"#7dd3fc");for(let x=23;x<60;x+=9)R(x,48,2,10,"#334155");
 R(18,42,46,4,"#475569");R(40,32,2,10,"#475569");R(39,29,4,3,Math.floor(t/500)%2?"#ff4d4d":"#7a1f1f");
 R(226,100,94,40,"#e2e8f0");R(226,96,94,4,"#64748b");R(226,110,94,10,"#93c5fd");for(let x=230;x<320;x+=12)R(x,110,2,10,"#475569");
 for(let y=122;y<140;y+=6)for(let x=226;x<320;x+=12)R(x+(y%12?6:0),y,1,6,"#cbd5e1");
 R(206,118,22,7,"#94a3b8");R(206,125,3,15,"#64748b");
 R(284,134,22,5,"#475569");R(286,139,4,3,OUT);R(300,139,4,3,OUT);R(288,129,8,5,"#8b5a2b");R(297,130,7,4,"#b07a45");
 const cx=150,cy=82+Math.round(Math.sin(t/700)*3);
 R(cx-28,cy+4,30,6,"#b8c4d3");R(cx-12,cy+10,10,5,"#94a3b8");
 R(cx-40,cy-6,76,12,"#f8fafc");R(cx+36,cy-4,4,9,"#f8fafc");R(cx+40,cy-2,2,5,"#f8fafc");R(cx-40,cy+3,80,3,"#cbd5e1");
 R(cx-40,cy,78,2,"#2563eb");R(cx+30,cy-4,8,3,"#1e293b");
 for(let x=cx-30;x<cx+26;x+=6)R(x,cy-3,3,2,"#60a5fa");
 R(cx-42,cy-22,8,16,"#2563eb");R(cx-46,cy-26,8,6,"#2563eb");R(cx-48,cy-4,14,4,"#cbd5e1");R(cx-40,cy-22,2,16,"#1d4ed8");
 const pe=seats.pilot;if(pe){pe.style.top=((cy-6)/SH*100)+"%";POS.pilot[1]=(cy-20)/SH*100}
}
if(reduce)drawScene(0);else{const loop=t=>{drawScene(t);requestAnimationFrame(loop)};requestAnimationFrame(loop)}

/* helpers */
const ST=LOG.stats||{};document.getElementById("modelchip").textContent=LIVE?(LIVE.fake?"fake agents (no API)":"live Claude agents"):`${ST.model||(LOG.fake_agents?"fake agents (no API)":"model: see config.yaml")}${ST.thinking?" · extended thinking":""}`;
function status(text,busy){const s=document.getElementById("status");s.classList.toggle("idle",!busy);document.getElementById("statusText").textContent=text}
function splash(a,b){const el=document.getElementById("splash");el.innerHTML=`${esc(a)}<small>${esc(b||"")}</small>`;el.classList.remove("go");void el.offsetWidth;el.classList.add("go")}
function plancard(t){const pc=document.getElementById("plancard");pc.textContent=t;pc.classList.remove("flip");void pc.offsetWidth;pc.classList.add("flip")}
function stamp(type){const s=document.createElement("div");s.className="stamp";const c=type==="consensus"?"var(--good)":"var(--bad)";s.style.borderColor=c;s.style.color=c;s.textContent=type==="consensus"?"Deal!":type==="fallback"?"Rulebook":"Human call";stage.appendChild(s)}
function setRound(r){document.getElementById("roundNo").textContent=r}
function think(ids,on,label){ids.forEach(id=>{const t=seats[id].querySelector(".think");t.innerHTML=label?esc(label):spinnerHTML();t.classList.toggle("spinonly",!label);t.classList.remove("say");t.classList.toggle("show",on);seats[id].classList.toggle("busy",on)})}
function say(id,text,ms){const t=seats[id].querySelector(".think");t.textContent=text;t.classList.remove("spinonly");t.classList.add("say","show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show","say"),ms||1450)}
function spotlight(ids){Object.keys(seats).forEach(id=>{seats[id].classList.toggle("dim",!!ids&&!ids.includes(id));seats[id].classList.toggle("lit",!!ids&&ids.includes(id))})}
function radio(from,to,type){
 const [x1,y1]=POS[from],[x2,y2]=POS[to],c=COL[type]||"var(--propose)";
 const r=document.createElement("div");r.className="ring";r.style.left=x1+"%";r.style.top=y1+"%";r.style.borderColor=c;stage.appendChild(r);setTimeout(()=>r.remove(),950);
 const p=document.createElement("div");p.className="packet";p.style.background=c;p.style.left=x1+"%";p.style.top=y1+"%";stage.appendChild(p);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{p.style.left=x2+"%";p.style.top=y2+"%"}));
 setTimeout(()=>p.remove(),850);
}
function token(from,txt){const [x1,y1]=POS[from],[x2,y2]=POS.coord;const t=document.createElement("div");t.className="token";t.textContent=txt;t.style.left=x1+"%";t.style.top=(y1-10)+"%";stage.appendChild(t);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{t.style.left=x2+"%";t.style.top=(y2-12)+"%"}));setTimeout(()=>t.remove(),1500)}
function shield(at){const [x,y]=POS[at];const s=document.createElement("div");s.className="shield";s.style.left=x+"%";s.style.top=(y-14)+"%";
 s.innerHTML=`<svg viewBox="0 0 9 10" shape-rendering="crispEdges" width="24" height="28"><path fill="#1b1f3b" d="M1 0h7v1h1v5H8v2H7v1H6v1H3V9H2V8H1V6H0V1h1z"/><path fill="#e5484d" d="M1 1h7v5H7v2H6v1H3V8H2V6H1z"/><path fill="#fff" d="M4 2h1v4H4zM4 7h1v1H4z"/></svg>`;stage.appendChild(s);setTimeout(()=>s.remove(),950)}
function fireworks(){const cols=["#ffd447","#ff8a3d","#3fae54","#4f8cff","#e5484d","#fff"];for(let i=0;i<28;i++){const s=document.createElement("div");s.className="spark";s.style.left="50%";s.style.top="45%";s.style.background=cols[i%6];
 const a=i/28*Math.PI*2,d=50+Math.random()*70;s.style.setProperty("--dx",Math.cos(a)*d+"px");s.style.setProperty("--dy",Math.sin(a)*d+"px");stage.appendChild(s);setTimeout(()=>s.remove(),1200)}}
function locks(rs){const el=document.getElementById("locks");if(el)el.innerHTML=(rs||[]).map(r=>`<i class="${r.passed?"ok":"no"}" title="${esc(r.rule_id)}"></i>`).join("")}
const feas=(set,id)=>(checks[set]&&checks[set][id]||[]).every(r=>r.passed);
function strip(set,pick){
 const el=document.getElementById("cstrip");
 if(!cands.length){el.innerHTML=`<p class="note" style="grid-column:1/-1">The candidate plans appear here when the run finishes.</p>`;return}
 el.innerHTML=cands.map(c=>{const st=!set?"":pick===c.id?"pick":feas(set,c.id)?"ok":"no";
  return `<div class="cand ${st}" title="${esc(c.concession||"no concession")}"><b>${esc(c.id)}</b>${esc(c.landing)}<br>gate ${esc(c.gate)}<br>${c.extra_holding_min?("+"+c.extra_holding_min+"m hold"):"no hold"}</div>`}).join("")}
function addLog(turn,type,who,to,text,json){
 const l=document.getElementById("log");if(l.dataset.fresh!=="0"){l.innerHTML="";l.dataset.fresh="0"}
 const e=document.createElement("div");e.className="entry";
 e.innerHTML=`<div class="eh">${turn!==null?`<span class="chip">${turn===0?"Setup":"Round "+turn}</span>`:""}<span class="t ${type}">${type}</span><b>${esc(who)}</b>${to?`<span style="color:var(--muted)">→ ${esc(to)}</span>`:""}</div><p>${esc(text)}</p>${json?`<details><summary>Message JSON</summary><pre>${esc(JSON.stringify(json,null,2))}</pre></details>`:""}`;
 l.appendChild(e);l.scrollTop=l.scrollHeight}

/* ---------- live mode: the run is happening now, shown in the same scene ---------- */
const ids=["atc","pilot","ground"];
if(LIVE){
 document.getElementById("wrap").classList.add("live");quiet(true);
 const ph=LIVE.phase;  // 0 build, 1 round 1, 2 coordinator, 3 round 2, 4 final
 const o=document.getElementById("outcome");o.textContent="Running…";
 setRound(ph>=3?2:ph>=1?1:0);strip(null);
 document.getElementById("log").dataset.fresh="1";
 (LIVE.lines||[]).forEach((m,k)=>addLog(null,"LIVE",k===0?"Coordinator":"Coordinator","",m,null));
 status(LIVE.lines&&LIVE.lines.length?LIVE.lines[LIVE.lines.length-1]:"Starting…",true);
 if(ph===1||ph===3){spotlight(ids);think(ids,true);plancard(ph===3?"Voting on the plan…":"Agents are proposing…");if(!reduce)ids.forEach((id,k)=>setTimeout(()=>radio("coord",id,ph===3?"PROPOSAL":"SHARE"),k*250))}
 else{spotlight(null);plancard(ph===2?"Checking concessions…":ph>=4?"Final recheck…":"Building plans…")}
}

/* ---------- replay: build the timeline from the finished log ---------- */
const r1=(LOG.rounds||[]).find(r=>r.round===1),r2=(LOG.rounds||[]).find(r=>r.round===2),cp=LOG.compromise,out=LOG.outcome||{};
const steps=[];
if(!LIVE){
steps.push(()=>{setRound(0);spotlight(null);ids.forEach(id=>radio("coord",id,"SHARE"));strip(null);status("Coordinator shares the flight",false);
 addLog(0,"SHARE","Coordinator","Ava, Pip, Gus",`Scenario ${LOG.scenario.scenario_id} shared: ${H.carrier} ${H.flight} ${H.origin}→${H.destination}, weather delay ${H.weather_delay_min} min, late aircraft ${H.late_aircraft_delay_min} min. Each agent also gets its own private simulated state.`,null)});
if(r1){
 steps.push(()=>{setRound(1);splash("Round 1","offers and concessions");spotlight(ids);think(ids,true);status("Round 1: agents thinking",true);strip("before_concessions");
  addLog(1,"CHECK","Coordinator","",`Checker ran on ${cands.length} candidates before any concession: ${(cp&&cp.feasible_before||[]).length} pass (${(cp&&cp.feasible_before||[]).join(", ")||"none"}). All three agents think in parallel.`,null)});
 r1.offers.forEach(o=>steps.push(()=>{think([o.agent],false);radio(o.agent,"coord","OFFER");status(`${AG[o.agent].name} offers: prefers ${o.preferred}`,true);
  say(o.agent,o.preferred?`I prefer ${o.preferred}${o.concessions.length?" · I can concede":""}`:"No valid offer");
  addLog(1,"OFFER",AG[o.agent].name,"Coordinator",`Prefers ${o.preferred}. Accepts ${o.acceptable.join(", ")}. Cites ${o.constraints_cited.join(", ")}. ${o.rationale}`,o)}));
 const concs=(cp&&cp.concessions_applied)||[];
 if(concs.length)steps.push(()=>{spotlight(ids);status("Coordinator applies concessions",true);concs.forEach(c=>token(c.agent,c.id.replace(/_/g," ").toLowerCase()));
  setTimeout(()=>strip("after_concessions"),700);
  addLog(1,"CONCESSION","Coordinator","",`Applied ${concs.map(c=>`${AG[c.agent].name}: ${c.id} (${c.target})`).join("; ")}. Now ${cp.feasible_after.length} candidates pass: ${cp.feasible_after.join(", ")}.`,concs)});
}
if(cp&&cp.proposal){
 steps.push(()=>{spotlight(null);status("Coordinator freezes one plan",false);strip("after_concessions",cp.proposal.candidate);ids.forEach(id=>radio("coord",id,"PROPOSAL"));
  const c=cands.find(x=>x.id===cp.proposal.candidate),k=LOG.costs[c.id];plancard(`${c.id}: land ${c.landing}, gate ${c.gate}`);
  addLog(1,"PROPOSAL","Coordinator","Ava, Pip, Gus",`Frozen proposal v${cp.proposal.version}: ${c.id}, land ${c.landing}, gate ${c.gate}, ${c.extra_holding_min} min extra holding. Rule: ${cp.rule}. Simulated cost $${k.total_usd.toLocaleString()}.`,cp.proposal)});
}
if(r2){
 steps.push(()=>{setRound(2);splash("Round 2","final vote");spotlight(ids);think(ids,true);status("Round 2: agents voting",true)});
 r2.votes.forEach(v=>steps.push(()=>{think([v.agent],false);const T=v.vote.toUpperCase();status(`${AG[v.agent].name} votes ${v.vote}`,true);
  if(v.vote!=="abstain")say(v.agent,v.vote==="accept"?"I accept":"I reject");
  if(v.vote==="abstain"){think([v.agent],true,"timeout");setTimeout(()=>think([v.agent],false),1400)}
  radio(v.agent,"coord",T);if(v.vote!=="accept")setTimeout(()=>shield("coord"),700);
  addLog(2,T,AG[v.agent].name,"Coordinator",v.rationale,v)}));
}
steps.push(()=>{spotlight(null);const fc=out.final_candidate;
 const set=out.type==="fallback"?"before_concessions":"after_concessions";
 if(fc){locks(checks[set][fc]);strip(set,fc)}
 setTimeout(()=>stamp(out.type),600);
 status(out.type==="consensus"?"Deal reached":out.type==="fallback"?"Rulebook decided":"Escalated to you",false);
 if(out.type==="consensus"){fireworks();addLog(null,"CONSENSUS","Coordinator","",`${out.reason} Unlocked by: ${(out.concessions_that_unlocked||[]).join(" + ")||"no concession"}.`,out)}
 else if(out.type==="fallback"){shield("coord");addLog(null,"FALLBACK","Rulebook","",`${out.reason} Rulebook picks ${fc}.`,LOG.fallback)}
 else{shield("coord");addLog(null,"ESCALATE","Rulebook","you",out.reason,out);
  const EA=LOG.escalation_assist;
  if(EA&&EA.main_blocker){const mb=EA.main_blocker,s0=(EA.suggestions||[])[0],o=EA.costly_option;
   addLog(null,"CHECK","Coco","you",`Main blocker: ${mb.rule_id} ${mb.title.toLowerCase()} (${mb.plans} of ${mb.of} plans).`+(s0?` You could: ${s0.actions[0].toLowerCase()}.`:"")
    +(o?` Safe but costly: plan ${o.candidate} with ${o.fix_labels.join(" + ").toLowerCase()}, +$${Math.round(o.extra_vs_cheapest_normal_usd).toLocaleString()}. Your decision.`:" No costly fix passes every check either."),EA)}}
 const o=document.getElementById("outcome");o.className="outcome "+out.type;o.textContent=out.type==="consensus"?"Consensus":out.type==="fallback"?"Fallback, not consensus":"Escalated"});
steps.push(()=>{spotlight(["mod"]);
 const hd=LOG.human_decision;
 const EA=LOG.escalation_assist,o=EA&&EA.costly_option;
 say("mod",hd?(hd.approved?"You approved it":"You rejected it"):out.type==="escalation"&&EA&&EA.main_blocker?`Blocked by ${EA.main_blocker.rule_id}.`+(o?` Safe but costly: +$${Math.round(o.extra_vs_cheapest_normal_usd).toLocaleString()}. Your call.`:" Over to you."):"Over to you: approve or reject",5000);
 status(hd?(hd.approved?"You approved":"You rejected"):"Your call: approve or reject",false);
 addLog(null,hd?(hd.approved?"APPROVED":"REJECT"):"REVIEW","You (duty manager)","",hd?`${hd.approved?"Approved":"Rejected"} by ${hd.by||"duty manager"}.`:"Evidence sent to the duty manager. Approve or reject below the replay.",hd)});
}

/* agent card */
function showAgent(id){
 const card=document.getElementById("agentcard");card.classList.add("show");
 const o=r1&&r1.offers.find(x=>x.agent===id),v=r2&&r2.votes.find(x=>x.agent===id),sim=(LOG.scenario.simulated||{})[id];
 card.innerHTML=`<div class="ah"><span id="acs"></span><div><h3>${AG[id].name}, ${AG[id].role}</h3><p class="note">${id==="mod"?"Plain code, no AI. Applies the concessions, rechecks every plan and freezes one proposal. You make the final call.":"Its own LLM call each round, with its own prompt and private state."}</p></div></div>
 <dl class="kv">${id==="mod"?`<dt>Frozen plan</dt><dd>${esc(cp&&cp.proposal?cp.proposal.candidate:"none")}</dd><dt>Your decision</dt><dd>${esc(LOG.human_decision?(LOG.human_decision.approved?"Approved":"Rejected"):"Pending")}</dd>`:
 `<dt>Private state</dt><dd>${esc(sim?JSON.stringify(sim):"–")} <em>(simulated)</em></dd>
 <dt>Round 1 prefers</dt><dd>${esc(o?o.preferred:"–")}</dd><dt>Accepts</dt><dd>${esc(o?o.acceptable.join(", "):"–")}</dd>
 <dt>Checks cited</dt><dd>${esc(o?o.constraints_cited.join(", "):"–")}</dd><dt>Concession</dt><dd>${esc(o&&o.concessions.length?o.concessions.map(c=>c.id+" ("+c.target+")").join(", "):"none")}</dd>
 <dt>Reasoning</dt><dd>${esc(o?o.rationale:"–")}</dd><dt>Round 2 vote</dt><dd>${esc(v?v.vote+": "+v.rationale:"–")}</dd>`}</dl>`;
 card.querySelector("#acs").appendChild(newSprite(id));
}

/* player */
let i=0,timer=null;
function restart(){clearTimeout(timer);i=0;quiet(false);stage.querySelectorAll(".stamp").forEach(n=>n.remove());document.getElementById("plancard").textContent="No plan yet";document.getElementById("log").dataset.fresh="1";document.getElementById("log").innerHTML='<p class="note">Press Play. Every message appears here with its JSON.</p>';
 setRound(0);spotlight(null);think(["atc","pilot","ground","mod"],false);strip(null);locks([]);status("Ready: press Play",false);const o=document.getElementById("outcome");o.className="outcome pending";o.textContent="Ready"}
function step(){if(i>=steps.length)return false;steps[i++]();return i<steps.length}
document.getElementById("play").addEventListener("click",()=>{restart();quiet(true);const tick=()=>{if(step())timer=setTimeout(tick,reduce?60:1500)};tick()});
document.getElementById("step").addEventListener("click",()=>{clearTimeout(timer);if(i>=steps.length)restart();quiet(true);step()});
document.getElementById("restart").addEventListener("click",restart);
if(!LIVE)restart();
</script>
</body>
</html>
